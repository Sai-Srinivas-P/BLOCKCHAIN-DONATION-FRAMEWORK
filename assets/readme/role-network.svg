<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title">
<title id="title">Donor recipient hospital administrator role network</title>
<defs>
 <radialGradient id="bg3"><stop stop-color="#173f3b"/><stop offset="1" stop-color="#08131f"/></radialGradient>
 <style>.t{font-family:Inter,Arial,sans-serif;fill:#effcff}.m{font-family:Inter,Arial,sans-serif;fill:#93b0ba}</style>
</defs>
<rect width="1200" height="600" rx="38" fill="url(#bg3)"/>
<text x="52" y="58" class="m" font-size="16" letter-spacing="3">FOUR-SIDED WORKFLOW</text>
<text x="52" y="99" class="t" font-size="34" font-weight="800">People → review → matching → verified trail</text>

<g fill="none" stroke="#315362" stroke-width="3">
 <path d="M225 260 H975"/><path d="M225 340 H975"/><path d="M330 210 L600 300 L870 210"/><path d="M330 390 L600 300 L870 390"/>
</g>
<g fill="none" stroke="#4de6ff" stroke-width="4" stroke-dasharray="12 12">
 <path d="M225 260 H975"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/></path>
 <path d="M225 340 H975"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.4s" repeatCount="indefinite"/></path>
</g>

<g transform="translate(110 205)">
 <circle cx="115" cy="95" r="75" fill="#102a38" stroke="#4de6ff" stroke-width="3"/>
 <text x="115" y="88" text-anchor="middle" class="t" font-size="21" font-weight="800">DONOR</text>
 <text x="115" y="116" text-anchor="middle" class="m" font-size="14">register · OTP · donate</text>
</g>

<g transform="translate(485 205)">
 <circle cx="115" cy="95" r="75" fill="#102a38" stroke="#72f2c1" stroke-width="3"/>
 <text x="115" y="88" text-anchor="middle" class="t" font-size="21" font-weight="800">RECIPIENT</text>
 <text x="115" y="116" text-anchor="middle" class="m" font-size="14">request · urgency · status</text>
</g>

<g transform="translate(860 205)">
 <circle cx="115" cy="95" r="75" fill="#102a38" stroke="#4de6ff" stroke-width="3"/>
 <text x="115" y="88" text-anchor="middle" class="t" font-size="21" font-weight="800">HOSPITAL</text>
 <text x="115" y="116" text-anchor="middle" class="m" font-size="14">test · approve · match</text>
</g>

<g transform="translate(485 385)">
 <rect width="230" height="120" rx="26" fill="#102a38" stroke="#d6f86d" stroke-width="2"/>
 <text x="115" y="44" text-anchor="middle" class="t" font-size="20" font-weight="800">ADMIN</text>
 <text x="115" y="73" text-anchor="middle" class="m" font-size="14">approve hospitals</text>
 <text x="115" y="94" text-anchor="middle" class="m" font-size="14">review platform state</text>
</g>

<g transform="translate(1020 430)">
 <circle cx="0" cy="0" r="14" fill="#72f2c1"><animate attributeName="opacity" values=".3;1;.3" dur="1.5s" repeatCount="indefinite"/></circle>
 <text x="-180" y="7" class="m" font-size="14">status changes ripple through the workflow</text>
</g>
</svg>