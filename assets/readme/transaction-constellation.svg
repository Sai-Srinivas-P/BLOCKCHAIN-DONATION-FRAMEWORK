<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title">
<title id="title">Blockchain transaction constellation</title>
<defs>
 <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#142c28"/></linearGradient>
 <style>.t{font-family:Inter,Arial,sans-serif;fill:#e9fbff}.m{font-family:Inter,Arial,sans-serif;fill:#95b1bf}.c{fill:#4de6ff}.g{fill:#72f2c1}</style>
</defs>
<rect width="1200" height="520" rx="34" fill="url(#bg2)"/>
<text x="45" y="55" class="m" font-size="17" letter-spacing="3">TRANSACTION CONSTELLATION</text>
<text x="45" y="95" class="t" font-size="34" font-weight="800">Hash → RPC → Mine → Persist</text>

<g stroke="#345464" stroke-width="2">
 <path d="M170 250 H430"/><path d="M430 250 H690"/><path d="M690 250 H950"/>
</g>
<g stroke="#4de6ff" stroke-width="4" stroke-dasharray="10 12">
 <path d="M170 250 H430"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.8s" repeatCount="indefinite"/></path>
 <path d="M430 250 H690"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.5s" repeatCount="indefinite"/></path>
 <path d="M690 250 H950"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.7s" repeatCount="indefinite"/></path>
</g>

<g transform="translate(65 170)">
 <rect width="210" height="160" rx="24" fill="#0d1b2a" stroke="#4de6ff"/>
 <text x="24" y="42" class="t" font-size="18" font-weight="700">01 · HASH</text>
 <text x="24" y="82" class="m" font-size="15">SHA-256 of a</text>
 <text x="24" y="104" class="m" font-size="15">registration/donation record</text>
 <text x="24" y="136" class="c" font-family="monospace" font-size="13">a91f...f4c2</text>
</g>

<g transform="translate(325 170)">
 <rect width="210" height="160" rx="24" fill="#0d1b2a" stroke="#72f2c1"/>
 <text x="24" y="42" class="t" font-size="18" font-weight="700">02 · WEB3.PY</text>
 <text x="24" y="82" class="m" font-size="15">HTTPProvider</text>
 <text x="24" y="104" class="m" font-size="15">+ contract.transact()</text>
 <text x="24" y="136" class="g" font-family="monospace" font-size="13">127.0.0.1:7545</text>
</g>

<g transform="translate(585 170)">
 <rect width="210" height="160" rx="24" fill="#0d1b2a" stroke="#4de6ff"/>
 <text x="24" y="42" class="t" font-size="18" font-weight="700">03 · GANACHE</text>
 <text x="24" y="82" class="m" font-size="15">transaction mined</text>
 <text x="24" y="104" class="m" font-size="15">receipt + block data</text>
 <circle cx="172" cy="132" r="10" fill="#4de6ff"><animate attributeName="r" values="7;12;7" dur="1.2s" repeatCount="indefinite"/></circle>
</g>

<g transform="translate(845 170)">
 <rect width="290" height="160" rx="24" fill="#0d1b2a" stroke="#72f2c1"/>
 <text x="24" y="42" class="t" font-size="18" font-weight="700">04 · DJANGO DB</text>
 <text x="24" y="82" class="m" font-size="15">TransactionDetail /</text>
 <text x="24" y="104" class="m" font-size="15">OrganTransactionDetail</text>
 <text x="24" y="136" class="g" font-family="monospace" font-size="13">hash · block · gas · time</text>
</g>

<path d="M600 355 C600 405 870 415 870 360" fill="none" stroke="#72f2c1" stroke-width="3" stroke-dasharray="8 10">
<animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2s" repeatCount="indefinite"/>
</path>
<text x="600" y="440" text-anchor="middle" class="m" font-size="14">A local ledger trail, captured back into Django records.</text>
</svg>